name: Self-hosted Codex smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/self-hosted-smoke.yml'
      - 'harness/**'
      - 'fixtures/smoke/**'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: [self-hosted, macOS]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Inspect runner and Codex without exposing credentials
        shell: bash
        run: |
          set -euo pipefail
          uname -a
          sw_vers
          command -v codex
          codex --version
          test -f "${CODEX_HOME:-$HOME/.codex}/auth.json"
          echo 'Codex CLI and local auth file are present.'

      - name: Run deterministic subscription-authenticated Codex smoke task
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results/smoke
          START=$(date +%s)
          codex exec --json --sandbox read-only \
            'Read fixtures/smoke/input.txt. Return only the integer obtained by adding the two integers in that file. Do not use network access.' \
            > results/smoke/codex-events.jsonl
          END=$(date +%s)
          echo $((END-START)) > results/smoke/wall-seconds.txt

      - name: Extract answer and usage evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 harness/collect_smoke.py results/smoke/codex-events.jsonl results/smoke/summary.json
          python3 harness/verify_smoke.py results/smoke/summary.json fixtures/smoke/expected.txt

      - name: Upload smoke evidence
        uses: actions/upload-artifact@v4
        with:
          name: codex-smoke-evidence
          path: results/smoke/
          if-no-files-found: error
          retention-days: 14
