name: Probe self-hosted runner

on:
  pull_request:
    paths:
      - '.github/workflows/probe.yml'

jobs:
  probe:
    runs-on: [self-hosted, macOS, ARM64, curlop-bench]
    timeout-minutes: 5
    steps:
      - run: |
          echo runner-ok
          hostname
          uname -a
          sysctl -n machdep.cpu.brand_string
