# Repository-only shutdown configuration.
# This benchmark repo is paused: expose no optional skills, apps, web search,
# shell execution, or Serena MCP tooling here. Global/user configuration and
# every other repository remain unchanged.

web_search = "disabled"

[skills]
include_instructions = false

[apps._default]
enabled = false

[features]
shell_tool = false
remote_plugin = false
skill_mcp_dependency_install = false

[mcp_servers.serena]
enabled = false
